name: CI/CD Test & Deploy to Debian VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Unit & Microstructure Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest test_engine.py test_storage.py

  deploy:
    name: 🚀 Deploy to Low-Latency Debian VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            if [ -f /opt/poly-harvester/scripts/deploy.sh ]; then
              bash /opt/poly-harvester/scripts/deploy.sh
            else
              echo "🚀 First-time VPS bootstrap detected! Running automated provisioner..."
              curl -sSL https://raw.githubusercontent.com/0x7sec/poly-harvester/main/scripts/setup_vps.sh | bash
            fi
