name: CI/CD Test & Deploy to Debian VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 🧪 Run Unit & Microstructure Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest test_engine.py test_storage.py

  deploy:
    name: 🚀 Deploy to Low-Latency Debian VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: false
          script: |
            set -x
            export DEBIAN_FRONTEND=noninteractive
            
            # 1. Install base essentials if missing
            apt-get update -y
            apt-get install -y git curl python3 python3-venv python3-dev python3-pip build-essential pkg-config libssl-dev nginx ufw
            
            # 2. Clone or update repository
            if [ ! -d "/opt/poly-harvester/.git" ]; then
              rm -rf /opt/poly-harvester
              git clone https://github.com/0x7sec/poly-harvester.git /opt/poly-harvester
            fi
            
            cd /opt/poly-harvester
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Execute setup / deployment
            bash scripts/setup_vps.sh
